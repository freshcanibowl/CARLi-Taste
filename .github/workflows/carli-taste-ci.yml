name: CARLi Taste Quality Gate
on:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/carli-taste-ci.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/carli-taste-ci.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Install browser smoke dependency
        run: npm install --no-save --no-audit --no-fund playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser journey smoke
        run: |
          npm run start -- --port 3127 > /tmp/carli-next.log 2>&1 &
          app_pid=$!
          trap 'kill $app_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3127/journey > /dev/null; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:3127/journey > /dev/null
          node tests/journey-browser-smoke.mjs
          node tests/adaptive-browser-smoke.mjs
